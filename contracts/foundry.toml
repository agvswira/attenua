[profile.default]
src = "src"
test = "test"
out = "out-forge"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
dynamic_test_linking = false
fs_permissions = [{ access = "read", path = "test/fixtures" }]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 256
depth = 32
fail_on_revert = false
